name: Quality
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt -r requirements-eval.txt
      - run: python -m pytest -q --ignore=tests/test_interlock_truth.py -W error::pytest.PytestUnhandledThreadExceptionWarning
      - run: node --check live/static/control-room.js && node --check sim_app/static/app.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend_smoke.cjs
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libjsoncpp-dev liblapacke-dev
      - run: mkdir -p artifacts/simulator
      - run: g++ -std=c++17 -Wall -Wextra -Werror simulation/simulation/main.cc simulation/simulation/TE_process.cc -ljsoncpp -llapacke -lpthread -o artifacts/simulator/simulation
      - run: python3 scripts/check_simulator.py artifacts/simulator/simulation
