; SCRAM: run only the TE simulator. The image's default config also starts the
; Modbus devices (feed1.py ...), which re-write all four valve setpoints from
; their registers every cycle and would silently overwrite whatever L0 sends on
; :55555. Mounted over the image's config by docker-compose.yml; image untouched.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:simulation]
command=/app/simulation/simulation
autorestart=true
stdout_logfile=/var/log/supervisor/simulation.log
stderr_logfile=/var/log/supervisor/simulation.err
