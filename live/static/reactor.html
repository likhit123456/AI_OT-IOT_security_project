<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRFICS reactor</title>
<!-- Served at /grfics/reactor.html; the relative URLs below go through the control-room
     proxy to the plant's web server, so the Unity build loads same-origin and only the
     reactor is shown (no GRFICS lab dashboard around it). -->
<script src="Build/UnityLoader.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
  #unity { position: absolute; inset: 0; }
  #unity canvas { width: 100% !important; height: 100% !important; display: block; }
  #load { position: absolute; inset: 0; display: grid; place-items: center; color: #8fa29e;
          font: 500 13px/1.4 "IBM Plex Mono", ui-monospace, Consolas, monospace; letter-spacing: .06em; }
  #load b { display: block; width: 220px; height: 3px; margin-top: 10px; background: #1c2726; border-radius: 2px; overflow: hidden; }
  #load i { display: block; height: 100%; width: 0; background: #3fbfb2; transition: width .2s; }
  #load.err { color: #ef6a5f; }
</style>
</head>
<body>
<div id="unity"></div>
<div id="load" role="status"><div><span id="message">LOADING 3D PLANT</span><b><i id="bar"></i></b><button id="retry" hidden>Retry 3D view</button></div></div>
<script>
  const load = document.getElementById("load"), bar = document.getElementById("bar");
  const message = document.getElementById("message"), retry = document.getElementById("retry");
  let state = "loading", check;
  const report = (status, detail) => window.parent.postMessage({type: "scram-unity", status, detail}, location.origin);
  const fail = (detail) => {
    if (state === "error") return;
    state = "error";
    clearInterval(check);
    load.hidden = false;
    load.style.display = "grid";
    load.className = "err";
    message.textContent = detail;
    retry.hidden = false;
    report("error", detail);
  };
  retry.addEventListener("click", () => location.reload());
  window.addEventListener("error", () => fail("3D asset or runtime failed to load. Retry the 3D view."), true);
  window.addEventListener("unhandledrejection", () => fail("3D startup failed. Retry the 3D view."));
  report("loading", "Loading 3D plant assets…");
  try {
    if (typeof UnityLoader === "undefined") throw new Error("Unity loader unavailable");
    window.unityInstance = UnityLoader.instantiate("unity", "Build/ChemicalPlant.json", {
      onProgress: (inst, p) => {
        if (state !== "loading") return;
        bar.style.width = Math.round(p * 100) + "%";
        message.textContent = p >= 1 ? "STARTING 3D RUNTIME…" : `LOADING 3D PLANT ${Math.round(p * 100)}%`;
      },
      Module: {onAbort: () => fail("3D runtime stopped during startup. Retry the 3D view.")},
    });
    const started = Date.now();
    check = setInterval(() => {
      if (state !== "loading") { clearInterval(check); return; }
      const runtime = window.unityInstance && window.unityInstance.Module;
      if (runtime && runtime.aborted) {
        fail("3D runtime failed. Retry the 3D view.");
      } else if (runtime && runtime.calledRun === true) {
        state = "ready";
        clearInterval(check);
        load.style.display = "none";
        report("ready", "3D runtime started");
      } else if (Date.now() - started >= 120000) {
        fail("3D startup timed out after 2 minutes. Check the simulator and retry.");
      } else if (Date.now() - started >= 20000) {
        message.textContent = "STILL LOADING 3D PLANT — large assets can take a while…";
      }
    }, 500);
  } catch (error) {
    fail("3D plant unavailable. Check the simulator and retry the 3D view.");
  }
</script>
</body>
</html>
